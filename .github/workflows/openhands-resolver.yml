name: OpenHands Issue Demo

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  openhands:
    if: github.event.label.name == 'fix-me'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build issue prompt
        shell: bash
        run: |
          {
            echo "# GitHub Issue Task"
            echo
            echo "Repository: ${{ github.repository }}"
            echo "Issue number: #${{ github.event.issue.number }}"
            echo "Issue title: ${{ github.event.issue.title }}"
            echo
            echo "## Issue body"
            cat <<'ISSUE_BODY'
          ${{ github.event.issue.body }}
          ISSUE_BODY
            echo
            echo "## Workflow instructions"
            cat .github/prompts/issue-fix.md
          } > issue-prompt.md

      - name: Start OpenHands from GitHub Issue
        id: openhands
        uses: All-Hands-AI/openhands-github-action@v1
        with:
          openhands-api-key: ${{ secrets.OPENHANDS_API_KEY }}
          repository: ${{ github.repository }}
          selected-branch: main
          poll: "true"
          timeout-seconds: "1800"
          prompt: issue-prompt.md

      - name: Comment result on issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = `${{ steps.openhands.outputs.status }}` || 'UNKNOWN';
            const url = `${{ steps.openhands.outputs.conversation-url }}`;

            let body =
              '🤖 **OpenHands workflow finished**\n\n' +
              `**Status:** \`${status}\``;

            if (url) {
              body += `\n\n🔗 [OpenHands conversation](${url})`;
            }

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
