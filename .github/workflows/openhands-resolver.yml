name: OpenHands Issue Demo

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  openhands:
    if: github.event.label.name == 'fix-me'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start OpenHands from GitHub Issue
        id: openhands
        uses: All-Hands-AI/openhands-github-action@v1
        with:
          openhands-api-key: ${{ secrets.OPENHANDS_API_KEY }}
          repository: ${{ github.repository }}
          selected-branch: main
          poll: "true"
          prompt: |
            A GitHub issue has requested a bug fix.

            Issue #${{ github.event.issue.number }}
            Title: ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Use the safe-bugfix skill in this repository.
            Investigate the issue, modify the necessary code,
            run the tests, and verify the fix.

            Delegate the final review to a reviewer sub-agent.

            If the fix is valid, commit the changes to a new branch
            and create a pull request referencing this issue.

      - name: Comment result on issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body:
                '🤖 OpenHands workflow finished.\n\n' +
                'Status: `${{ steps.openhands.outputs.status }}`\n\n' +
                '🔗 [OpenHands conversation](${{ steps.openhands.outputs.conversation-url }})'
            })
