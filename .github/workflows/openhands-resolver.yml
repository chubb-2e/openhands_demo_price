name: OpenHands Issue Resolver

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  resolve:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'fix-me') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@openhands-agent'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run OpenHands Resolver
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          PAT_USERNAME: ${{ vars.PAT_USERNAME }}
        run: |
          pip install openhands-ai

          python -m openhands.resolver.resolve_issue \
            --selected-repo "${{ github.repository }}" \
            --issue-number "${{ github.event.issue.number }}"

          python -m openhands.resolver.send_pull_request \
            --issue-number "${{ github.event.issue.number }}" \
            --username "${{ vars.PAT_USERNAME }}" \
            --pr-type draft
